<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Terminal - Server Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- xterm.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgb(14, 26, 40) 0%, rgb(8, 14, 21) 90%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden; /* Prevent body scroll */
        }

        /* Abstract glowing background blobs */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(85,239,196,0.1) 0%, transparent 70%);
            z-index: -1;
            filter: blur(40px);
            animation: float 10s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(116,185,255,0.08) 0%, transparent 70%);
            z-index: -1;
            filter: blur(50px);
            animation: float 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(20px) scale(1.05); }
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1rem;
            gap: 1rem;
        }

        /* Header / Glass Panel */
        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn.active {
            background: rgba(116, 185, 255, 0.2);
            border-color: rgba(116, 185, 255, 0.5);
            color: #74b9ff;
            box-shadow: 0 0 15px rgba(116, 185, 255, 0.2);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            overflow-x: auto;
            padding: 0 0.5rem;
        }
        .tabs::-webkit-scrollbar { height: 4px; }
        .tabs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .tab {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
            color: #8b949e;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            white-space: nowrap;
            min-width: 140px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #c9d1d9;
        }

        .tab.active {
            background: rgba(85, 239, 196, 0.1);
            color: #55efc4;
            border-color: rgba(85, 239, 196, 0.3);
            box-shadow: 0 0 10px rgba(85, 239, 196, 0.1);
        }

        .tab-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            outline: none;
        }

        .tab-name:focus {
            border-bottom: 1px dashed #55efc4;
        }

        .tab .close-tab {
            opacity: 0;
            cursor: pointer;
            font-size: 0.75rem;
            transition: opacity 0.2s, color 0.2s;
            color: #8b949e;
        }

        .tab:hover .close-tab {
            opacity: 1;
        }

        .tab .close-tab:hover {
            color: #ff7675;
        }

        /* Quick Commands Panel */
        .quick-commands {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex-wrap: wrap;
            align-items: center;
        }

        .cmd-category {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem;
            border-radius: 10px;
        }

        .cmd-category-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            margin-right: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .cmd-category-label.system { background: rgba(85, 239, 196, 0.1); color: #55efc4; }
        .cmd-category-label.docker { background: rgba(36, 150, 237, 0.1); color: #2496ed; }
        .cmd-category-label.network { background: rgba(162, 155, 254, 0.1); color: #a29bfe; }
        .cmd-category-label.logs { background: rgba(255, 234, 167, 0.1); color: #ffeaa7; }

        .quick-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #aaa;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Consolas', monospace;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* Mac-like Terminal Area */
        .terminal-container {
            flex: 1;
            background: #0f111a;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Terminal Window Bar */
        .terminal-container::before {
            content: 'TERMINAL — root@ekaharefa';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            background: rgba(30, 33, 45, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            font-size: 0.75rem;
            font-weight: 700;
            color: #8b949e;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        /* Mac Window Dots */
        .terminal-container::after {
            content: '';
            position: absolute;
            top: 14px;
            left: 18px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5f56;
            box-shadow: 22px 0 0 #ffbd2e, 44px 0 0 #27c93f;
            z-index: 2;
        }

        .terminal-wrap {
            flex: 1;
            padding: 1.2rem;
            display: none;
            background: #0d0f14;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }

        .terminal-wrap.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .terminal-wrap .xterm {
            height: 100%;
        }
        
        .xterm-viewport::-webkit-scrollbar { width: 10px; }
        .xterm-viewport::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 5px; }
        .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 5px; }
        .xterm-viewport::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* Settings Bar Footer */
        .settings-bar {
            display: flex;
            gap: 1.5rem;
            padding: 0.8rem 1.5rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            align-items: center;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-bar label {
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
        }

        .settings-bar select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }
        
        .settings-bar select:focus {
            border-color: #55efc4;
        }

        .readonly-badge {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.4);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            animation: pulseError 2s infinite;
        }

        @keyframes pulseError {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1e1e28;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border-radius: 16px;
            padding: 2rem;
            width: 500px;
            max-width: 90%;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-content h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: #fff;
        }

        .modal-content textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #55efc4;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-family: 'Consolas', monospace;
            min-height: 150px;
            resize: vertical;
            outline: none;
        }
        
        .modal-content textarea:focus {
            border-color: #55efc4;
            box-shadow: 0 0 10px rgba(85,239,196,0.1);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        /* ============================================================
           MOBILE TYPING — KETIK LANGSUNG DI DALAM TERMINAL
           xterm.js menaruh textarea helper-nya di `left: -9999em`
           dengan ukuran 0x0 dan z-index negatif. Browser mobile
           menolak memunculkan keyboard virtual untuk elemen seperti itu.
           Di perangkat sentuh kita tarik textarea tersebut ke dalam
           viewport dan bentangkan setransparan mungkin di atas kanvas
           terminal, sehingga tap = fokus = keyboard muncul, dan semua
           ketikan langsung masuk ke PTY lewat jalur xterm sendiri.
           ============================================================ */
        .terminal-wrap .xterm-helper-textarea.mobile-typing {
            /* Ditarik ke dalam viewport (aslinya left:-9999em, 0x0) karena
               browser mobile menolak memunculkan keyboard untuk elemen
               nol-ukuran di luar layar. Dibuat pipih dan pointer-events:none
               supaya sentuh/scroll pada kanvas terminal tetap normal —
               fokus diberikan secara programatis dari handler tap. */
            position: absolute !important;
            left: 0 !important;
            bottom: 0 !important;
            top: auto !important;
            width: 100% !important;
            height: 22px !important;
            z-index: 1 !important;
            pointer-events: none !important;
            opacity: 0.01 !important;
            background: transparent !important;
            color: transparent !important;
            caret-color: transparent !important;
            border: 0 !important;
            outline: none !important;
            resize: none !important;
            overflow: hidden !important;
            /* 16px mencegah iOS Safari auto-zoom saat fokus */
            font-size: 16px !important;
        }

        /* ============================================================
           MOBILE INPUT BAR (FALLBACK)
           Disembunyikan secara default. Hanya dipakai jika ketik
           langsung bermasalah di HP tertentu.
           ============================================================ */
        .mobile-bar {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 0.6rem;
        }

        .mobile-bar.visible {
            display: flex;
        }

        /* Baris text field hanya tampil saat mode fallback aktif */
        .mobile-input-row {
            display: none;
            gap: 0.5rem;
            align-items: center;
        }

        .mobile-bar.fallback .mobile-input-row {
            display: flex;
        }

        #mobile-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(85, 239, 196, 0.25);
            color: #55efc4;
            /* 16px wajib: mencegah iOS Safari auto-zoom saat input fokus */
            font-size: 16px;
            font-family: 'Consolas', Monaco, monospace;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            outline: none;
            min-width: 0;
        }

        #mobile-input:focus {
            border-color: #55efc4;
            box-shadow: 0 0 12px rgba(85, 239, 196, 0.15);
        }

        .mobile-send {
            background: rgba(85, 239, 196, 0.15);
            border: 1px solid rgba(85, 239, 196, 0.4);
            color: #55efc4;
            padding: 0.6rem 0.9rem;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .mobile-send:active {
            background: rgba(85, 239, 196, 0.3);
        }

        .mobile-keys {
            display: flex;
            gap: 0.35rem;
            overflow-x: auto;
            padding-bottom: 0.2rem;
            -webkit-overflow-scrolling: touch;
        }

        .mobile-keys::-webkit-scrollbar { height: 3px; }
        .mobile-keys::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .key-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #c9d1d9;
            /* Target sentuh minimal 40px untuk aksesibilitas */
            min-width: 42px;
            min-height: 40px;
            padding: 0 0.6rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'Consolas', monospace;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, border-color 0.15s;
        }

        .key-btn:active {
            background: rgba(255, 255, 255, 0.18);
        }

        /* Modifier (CTRL/ALT) dalam kondisi armed/aktif */
        .key-btn.armed {
            background: rgba(255, 189, 46, 0.2);
            border-color: rgba(255, 189, 46, 0.6);
            color: #ffbd2e;
        }

        .key-btn.danger {
            color: #ff7675;
            border-color: rgba(255, 118, 117, 0.3);
        }

        /* Tombol toggle keyboard di header */
        #kbd-toggle { display: none; }

        /* ============================================================
           RESPONSIVE / VIEWPORT
           100dvh dipakai agar area terminal tidak tertutup keyboard
           virtual (100vh tidak menyusut saat keyboard muncul).
           ============================================================ */
        body {
            min-height: 100dvh;
        }

        .container {
            height: 100dvh;
        }

        @media (max-width: 900px), (pointer: coarse) {
            #kbd-toggle { display: inline-flex; }

            .container {
                padding: 0.5rem;
                gap: 0.5rem;
            }

            .header {
                padding: 0.5rem 0.6rem;
                gap: 0.5rem;
                flex-wrap: nowrap;
            }

            .header h2 { display: none; }

            .tab { min-width: 110px; padding: 0.45rem 0.7rem; }

            /* Tombol close tab selalu terlihat: tidak ada hover di layar sentuh */
            .tab .close-tab { opacity: 1; }

            /* Panel quick command dilipat jadi satu baris yang bisa di-scroll */
            .quick-commands {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 0.5rem;
                gap: 0.5rem;
                -webkit-overflow-scrolling: touch;
            }

            .cmd-category { flex-shrink: 0; }

            .terminal-wrap { padding: 0.5rem; }

            /* Judul window Mac disembunyikan untuk menghemat tinggi layar */
            .terminal-container::before,
            .terminal-container::after { display: none; }

            .settings-bar {
                padding: 0.5rem 0.7rem;
                gap: 0.8rem;
                font-size: 0.75rem;
            }

            .settings-bar .hint-desktop { display: none; }

            /* Blob dekoratif dimatikan: filter blur berat di GPU mobile */
            body::before,
            body::after { display: none; }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="btn" onclick="window.location.href='/dashboard'"><i class="fa-solid fa-home"></i></button>
            <h2 style="font-weight:400; font-size:1rem"><i class="fa-solid fa-terminal" style="color:#55efc4"></i>
                Terminal</h2>

            <div class="tabs" id="tabs"></div>

            <button class="btn" onclick="addTab()"><i class="fa-solid fa-plus"></i></button>
            <button class="btn" id="kbd-toggle" onclick="toggleMobileBar()" title="Tampilkan/sembunyikan keyboard"
                aria-label="Tampilkan atau sembunyikan input keyboard"><i class="fa-solid fa-keyboard"></i></button>
            <button class="btn" onclick="showCustomCmdModal()"><i class="fa-solid fa-gear"></i></button>
        </div>

        <!-- Quick Commands - Categorized -->
        <div class="quick-commands">
            <!-- System -->
            <div class="cmd-category">
                <span class="cmd-category-label system"><i class="fa-solid fa-server"></i> System</span>
                <button class="quick-btn system" onclick="quickCmd('htop')"><i class="fa-solid fa-chart-line"></i>
                    htop</button>
                <button class="quick-btn system" onclick="quickCmd('top -b -n 1 | head -20')"><i
                        class="fa-solid fa-list"></i> top</button>
                <button class="quick-btn system" onclick="quickCmd('df -h')"><i class="fa-solid fa-hard-drive"></i> df
                    -h</button>
                <button class="quick-btn system" onclick="quickCmd('free -h')"><i class="fa-solid fa-memory"></i>
                    free</button>
                <button class="quick-btn system" onclick="quickCmd('uptime')"><i class="fa-solid fa-clock"></i>
                    uptime</button>
            </div>

            <!-- Docker -->
            <div class="cmd-category">
                <span class="cmd-category-label docker"><i class="fa-brands fa-docker"></i> Docker</span>
                <button class="quick-btn docker" onclick="quickCmd('docker ps')"><i class="fa-solid fa-cube"></i>
                    ps</button>
                <button class="quick-btn docker" onclick="quickCmd('docker ps -a')"><i class="fa-solid fa-cubes"></i> ps
                    -a</button>
                <button class="quick-btn docker" onclick="quickCmd('docker stats --no-stream')"><i
                        class="fa-solid fa-chart-bar"></i> stats</button>
                <button class="quick-btn docker" onclick="quickCmd('docker images')"><i
                        class="fa-solid fa-layer-group"></i> images</button>
            </div>

            <!-- Network -->
            <div class="cmd-category">
                <span class="cmd-category-label network"><i class="fa-solid fa-network-wired"></i> Network</span>
                <button class="quick-btn network" onclick="quickCmd('netstat -tlnp')"><i class="fa-solid fa-plug"></i>
                    netstat</button>
                <button class="quick-btn network" onclick="quickCmd('ip a')"><i class="fa-solid fa-ethernet"></i> ip
                    a</button>
                <button class="quick-btn network" onclick="quickCmd('ss -tuln')"><i
                        class="fa-solid fa-diagram-project"></i> ss</button>
            </div>

            <!-- Logs -->
            <div class="cmd-category">
                <span class="cmd-category-label logs"><i class="fa-solid fa-file-lines"></i> Logs</span>
                <button class="quick-btn logs" onclick="quickCmd('journalctl -f')"><i class="fa-solid fa-scroll"></i>
                    journal</button>
                <button class="quick-btn logs" onclick="quickCmd('dmesg -w')"><i class="fa-solid fa-bug"></i>
                    dmesg</button>
                <button class="quick-btn logs" onclick="quickCmd('tail -f /var/log/syslog')"><i
                        class="fa-solid fa-file-alt"></i> syslog</button>
            </div>

            <!-- ESP32 -->
            <div class="cmd-category">
                <span class="cmd-category-label system" style="background:rgba(255, 107, 107, 0.15); color:#ff6b6b">
                    <i class="fa-solid fa-microchip"></i> ESP32
                </span>
                <button class="quick-btn system" style="border-color: rgba(255, 107, 107, 0.3); color: #ff9f9f"
                    onclick="quickCmd('export TERM=xterm && screen /dev/ttyACM1 115200')">
                    <i class="fa-solid fa-bolt"></i> CONNECT SERIAL
                </button>
            </div>

            <!-- Custom Commands -->
            <div class="cmd-category" id="custom-commands"></div>
        </div>

        <!-- Terminal Area -->
        <div class="terminal-container" id="terminal-container"></div>

        <!--
            Mobile Input Bar
            Aktif otomatis pada perangkat sentuh. Mengirim input ke PTY lewat
            socket 'terminal_input' sama seperti xterm.onData, jadi tidak ada
            perubahan protokol di sisi server.
        -->
        <div class="mobile-bar" id="mobile-bar">
            <div class="mobile-keys" id="mobile-keys">
                <button class="key-btn" data-action="mode" id="key-mode" aria-label="Ganti mode input"
                    title="Ketik langsung di terminal — ketuk untuk pakai input bar"><i class="fa-solid fa-i-cursor"></i></button>
                <button class="key-btn" data-mod="ctrl" id="key-ctrl" aria-label="Tombol Ctrl">CTRL</button>
                <button class="key-btn" data-mod="alt" id="key-alt" aria-label="Tombol Alt">ALT</button>
                <button class="key-btn" data-seq="\t" aria-label="Tombol Tab">TAB</button>
                <button class="key-btn" data-seq="\x1b" aria-label="Tombol Escape">ESC</button>
                <button class="key-btn danger" data-seq="\x03" aria-label="Ctrl C interrupt">^C</button>
                <button class="key-btn" data-seq="\x04" aria-label="Ctrl D end of file">^D</button>
                <button class="key-btn" data-seq="\x1a" aria-label="Ctrl Z suspend">^Z</button>
                <button class="key-btn" data-seq="\x0c" aria-label="Ctrl L clear screen">^L</button>
                <button class="key-btn" data-seq="\x1b[A" aria-label="Panah atas"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="key-btn" data-seq="\x1b[B" aria-label="Panah bawah"><i class="fa-solid fa-arrow-down"></i></button>
                <button class="key-btn" data-seq="\x1b[D" aria-label="Panah kiri"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="key-btn" data-seq="\x1b[C" aria-label="Panah kanan"><i class="fa-solid fa-arrow-right"></i></button>
                <button class="key-btn" data-seq="\x1b[H" aria-label="Tombol Home">HOME</button>
                <button class="key-btn" data-seq="\x1b[F" aria-label="Tombol End">END</button>
                <button class="key-btn" data-seq="\x1b[5~" aria-label="Page Up">PgUp</button>
                <button class="key-btn" data-seq="\x1b[6~" aria-label="Page Down">PgDn</button>
                <button class="key-btn" data-seq="|" aria-label="Karakter pipe">|</button>
                <button class="key-btn" data-seq="~" aria-label="Karakter tilde">~</button>
                <button class="key-btn" data-seq="/" aria-label="Karakter garis miring">/</button>
                <button class="key-btn" data-seq="-" aria-label="Karakter minus">-</button>
                <button class="key-btn" data-seq="$" aria-label="Karakter dolar">$</button>
            </div>
            <div class="mobile-input-row">
                <input type="text" id="mobile-input" placeholder="Ketik perintah, lalu Enter…" autocomplete="off"
                    autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"
                    aria-label="Input perintah terminal">
                <button class="mobile-send" onclick="sendMobileInput()" aria-label="Kirim perintah">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Settings -->
        <div class="settings-bar">
            <label>Font:
                <select id="font-size" onchange="changeFontSize(this.value)">
                    <option value="12">12px</option>
                    <option value="14" selected>14px</option>
                    <option value="16">16px</option>
                    <option value="18">18px</option>
                </select>
            </label>
            <label>
                <input type="checkbox" id="read-only" onchange="toggleReadOnly(this.checked)"> Read-Only
            </label>
            <span id="readonly-badge" class="readonly-badge" style="display:none">READ-ONLY</span>
            <span class="hint-desktop" style="margin-left:auto; color:#666">Ctrl+C to interrupt • Double-click tab to rename</span>
        </div>
    </div>

    <!-- Custom Command Modal -->
    <div class="modal hidden" id="custom-cmd-modal">
        <div class="modal-content">
            <h3><i class="fa-solid fa-terminal"></i> Custom Commands</h3>
            <p style="color:#888; font-size:0.85rem; margin-bottom:1rem">Add your own quick commands (one per line:
                name=command)</p>
            <textarea id="custom-cmd-input" placeholder="Example:
MySQL=docker exec -it mariadb mysql -u root -p
Logs=tail -f /var/log/app.log
Restart App=systemctl restart myapp"></textarea>
            <div class="modal-actions">
                <button class="btn" onclick="hideCustomCmdModal()">Cancel</button>
                <button class="btn active" onclick="saveCustomCommands()"><i class="fa-solid fa-save"></i> Save</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let terminals = {};
        let activeTab = null;
        let tabCounter = 0;
        let isReadOnly = false;
        let currentFontSize = 14;

        // ============================================================
        // DETEKSI PERANGKAT SENTUH
        // xterm.js memposisikan textarea helper-nya di luar viewport,
        // sehingga tap pada kanvas terminal tidak memicu keyboard virtual
        // di Android Chrome / iOS Safari. Karena itu di perangkat sentuh
        // kita pakai input bar sendiri.
        // ============================================================
        const IS_TOUCH = ('ontouchstart' in window) ||
            (navigator.maxTouchPoints > 0) ||
            window.matchMedia('(pointer: coarse)').matches;

        // Status modifier untuk toolbar mobile (sekali pakai / one-shot)
        let modCtrl = false;
        let modAlt = false;

        // Riwayat perintah dari input bar mobile (panah atas/bawah lokal)
        let mobileHistory = [];
        let mobileHistoryIdx = -1;

        // URL params
        const urlParams = new URLSearchParams(window.location.search);
        const startPath = urlParams.get('path') || '/root';
        const startCmd = urlParams.get('cmd') || '';
        const lxdTarget = urlParams.get('lxd') || null;

        // Load custom commands from localStorage
        let customCommands = JSON.parse(localStorage.getItem('customCommands') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            addTab(startPath, startCmd ? 'Command' : 'Terminal 1');
            renderCustomCommands();
            initMobileInput();

            if (startCmd) {
                setTimeout(() => quickCmd(startCmd), 500);
            }
        });

        function addTab(path = '/root', name = null) {
            tabCounter++;
            const sessionId = 'term_' + tabCounter;
            const tabName = name || `Terminal ${tabCounter}`;

            // Create tab button
            const tabBtn = document.createElement('div');
            tabBtn.className = 'tab';
            tabBtn.id = 'tab-btn-' + sessionId;
            tabBtn.innerHTML = `
                <i class="fa-solid fa-terminal" style="font-size:0.7rem; opacity:0.7"></i>
                <span class="tab-name" contenteditable="true" spellcheck="false" 
                    onblur="saveTabName('${sessionId}', this.textContent)"
                    onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${tabName}</span>
                <span class="close-tab" onclick="closeTab('${sessionId}', event)"><i class="fa-solid fa-xmark"></i></span>
            `;
            tabBtn.onclick = (e) => {
                if (!e.target.classList.contains('close-tab') && !e.target.closest('.close-tab') && !e.target.classList.contains('tab-name')) {
                    switchTab(sessionId);
                }
            };
            document.getElementById('tabs').appendChild(tabBtn);

            // Create terminal wrap
            const termWrap = document.createElement('div');
            termWrap.className = 'terminal-wrap';
            termWrap.id = 'term-wrap-' + sessionId;
            document.getElementById('terminal-container').appendChild(termWrap);

            // Create xterm instance with custom theme
            const term = new Terminal({
                cursorBlink: true,
                fontSize: currentFontSize,
                fontFamily: 'Consolas, Monaco, "Courier New", monospace',
                theme: {
                    background: '#15151e',
                    foreground: '#d0d0d0',
                    cursor: '#55efc4',
                    cursorAccent: '#15151e',
                    selection: 'rgba(85,239,196,0.3)',
                    // Custom colors for better visibility
                    black: '#1e1e28',
                    red: '#ff7675',
                    green: '#55efc4',
                    yellow: '#ffeaa7',
                    blue: '#74b9ff',
                    magenta: '#a29bfe',
                    cyan: '#81ecec',
                    white: '#dfe6e9',
                    brightBlack: '#636e72',
                    brightRed: '#ff7675',
                    brightGreen: '#55efc4',
                    brightYellow: '#ffeaa7',
                    brightBlue: '#74b9ff',
                    brightMagenta: '#a29bfe',
                    brightCyan: '#81ecec',
                    brightWhite: '#ffffff'
                }
            });

            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(termWrap);
            fitAddon.fit();

            // Di perangkat sentuh, tarik textarea helper xterm ke dalam
            // viewport dan bentangkan transparan di atas kanvas. Dengan begitu
            // tap di mana pun pada terminal = fokus = keyboard virtual muncul,
            // dan ketikan mengalir lewat term.onData seperti di desktop.
            if (IS_TOUCH) {
                const helper = termWrap.querySelector('.xterm-helper-textarea');
                if (helper) {
                    helper.classList.add('mobile-typing');
                    helper.setAttribute('autocapitalize', 'off');
                    helper.setAttribute('autocorrect', 'off');
                    helper.setAttribute('autocomplete', 'off');
                    helper.setAttribute('spellcheck', 'false');
                }
            }

            // Handle resize
            const resizeObserver = new ResizeObserver(() => {
                fitAddon.fit();
                if (terminals[sessionId]) {
                    socket.emit('terminal_resize', {
                        session_id: sessionId,
                        rows: term.rows,
                        cols: term.cols
                    });
                }
            });
            resizeObserver.observe(termWrap);

            // Handle input
            term.onData(data => {
                if (!isReadOnly) {
                    socket.emit('terminal_input', {
                        session_id: sessionId,
                        input: data
                    });
                }
            });

            // Store
            terminals[sessionId] = { term, fitAddon, path, name: tabName };

            // Start terminal on server
            socket.emit('start_terminal', {
                session_id: sessionId,
                path: path,
                lxd_target: lxdTarget
            });

            switchTab(sessionId);
        }

        function saveTabName(sessionId, name) {
            if (terminals[sessionId]) {
                terminals[sessionId].name = name.trim() || 'Terminal';
            }
        }

        function switchTab(sessionId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.terminal-wrap').forEach(t => t.classList.remove('active'));

            document.getElementById('tab-btn-' + sessionId)?.classList.add('active');
            document.getElementById('term-wrap-' + sessionId)?.classList.add('active');

            activeTab = sessionId;

            if (terminals[sessionId]) {
                // Di perangkat sentuh, fokus hanya diberikan ke terminal jika
                // mode fallback (input bar) tidak aktif. Saat fallback aktif,
                // fokus harus tetap di input bar agar keyboard tidak tertutup.
                if (!IS_TOUCH || !isFallbackMode()) {
                    terminals[sessionId].term.focus();
                }
                terminals[sessionId].fitAddon.fit();
            }
        }

        function closeTab(sessionId, event) {
            event.stopPropagation();

            socket.emit('stop_terminal', { session_id: sessionId });

            document.getElementById('tab-btn-' + sessionId)?.remove();
            document.getElementById('term-wrap-' + sessionId)?.remove();

            if (terminals[sessionId]) {
                terminals[sessionId].term.dispose();
                delete terminals[sessionId];
            }

            if (activeTab === sessionId) {
                const remaining = Object.keys(terminals);
                if (remaining.length > 0) {
                    switchTab(remaining[0]);
                } else {
                    activeTab = null;
                }
            }
        }

        function quickCmd(cmd) {
            if (activeTab && terminals[activeTab] && !isReadOnly) {
                socket.emit('terminal_input', {
                    session_id: activeTab,
                    input: cmd + '\n'
                });
            }
        }

        // ============================================================
        // MOBILE INPUT
        // ============================================================

        /**
         * Mode input mobile:
         *   'direct'   -> ketik langsung di dalam terminal (default)
         *   'fallback' -> pakai input bar terpisah di bawah terminal
         * Disimpan di localStorage agar pilihan Tuan Eka bertahan.
         */
        let mobileMode = localStorage.getItem('termMobileMode') || 'direct';

        function isFallbackMode() {
            return mobileMode === 'fallback';
        }

        /** Fokuskan textarea helper xterm milik tab aktif (memicu keyboard). */
        function focusTerminalInput() {
            if (!activeTab || !terminals[activeTab]) return;
            const wrap = document.getElementById('term-wrap-' + activeTab);
            const helper = wrap && wrap.querySelector('.xterm-helper-textarea');
            if (helper) {
                helper.focus({ preventScroll: true });
            } else {
                terminals[activeTab].term.focus();
            }
        }

        /** Arahkan fokus ke target yang sesuai dengan mode aktif. */
        function focusMobileTarget() {
            if (isFallbackMode()) {
                document.getElementById('mobile-input').focus();
            } else {
                focusTerminalInput();
            }
        }

        function setMobileMode(mode) {
            mobileMode = mode;
            localStorage.setItem('termMobileMode', mode);

            const bar = document.getElementById('mobile-bar');
            bar.classList.toggle('fallback', isFallbackMode());

            const btn = document.getElementById('key-mode');
            if (btn) {
                btn.classList.toggle('armed', isFallbackMode());
                btn.title = isFallbackMode()
                    ? 'Mode input bar aktif — ketuk untuk ketik langsung di terminal'
                    : 'Ketik langsung di terminal — ketuk untuk pakai input bar';
            }

            clearMods();
            refitActive();
            focusMobileTarget();
        }

        function toggleMobileMode() {
            setMobileMode(isFallbackMode() ? 'direct' : 'fallback');
        }

        /**
         * Kirim data mentah ke PTY sesi aktif.
         * Jalur yang sama dipakai term.onData, jadi server tidak perlu diubah.
         */
        function sendRaw(data) {
            if (!activeTab || !terminals[activeTab] || isReadOnly) return;
            socket.emit('terminal_input', {
                session_id: activeTab,
                input: data
            });
        }

        /** Decode escape literal dari atribut data-seq menjadi byte asli. */
        function decodeSeq(s) {
            return s
                .replace(/\\x([0-9a-fA-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)))
                .replace(/\\t/g, '\t')
                .replace(/\\r/g, '\r')
                .replace(/\\n/g, '\n')
                .replace(/\\e/g, '\x1b');
        }

        /**
         * Ubah karakter menjadi control code (Ctrl+A = 0x01, dst).
         * Mengembalikan null jika karakter di luar rentang yang didukung.
         */
        function toCtrlChar(ch) {
            if (!ch) return null;
            const c = ch.toLowerCase();
            const code = c.charCodeAt(0);
            if (code >= 97 && code <= 122) {          // a-z
                return String.fromCharCode(code - 96);
            }
            const map = {
                '@': '\x00', '[': '\x1b', '\\': '\x1c',
                ']': '\x1d', '^': '\x1e', '_': '\x1f', ' ': '\x00'
            };
            return map[c] || null;
        }

        function setMod(which, value) {
            if (which === 'ctrl') {
                modCtrl = value;
                document.getElementById('key-ctrl').classList.toggle('armed', value);
            } else {
                modAlt = value;
                document.getElementById('key-alt').classList.toggle('armed', value);
            }
        }

        function clearMods() {
            setMod('ctrl', false);
            setMod('alt', false);
        }

        /**
         * Terjemahkan satu karakter dengan mempertimbangkan modifier armed.
         * Modifier bersifat one-shot: otomatis lepas setelah satu karakter.
         */
        function applyMods(ch) {
            let out = ch;
            if (modCtrl) {
                const ctrl = toCtrlChar(ch);
                if (ctrl !== null) out = ctrl;
            }
            if (modAlt) {
                out = '\x1b' + out;   // Alt dikirim sebagai ESC prefix
            }
            if (modCtrl || modAlt) clearMods();
            return out;
        }

        /** Kirim isi input bar sebagai satu baris perintah + Enter. */
        function sendMobileInput() {
            const input = document.getElementById('mobile-input');
            const value = input.value;

            // Kirim walau kosong: Enter kosong valid di prompt interaktif
            sendRaw(value + '\r');

            if (value.trim()) {
                mobileHistory.push(value);
                if (mobileHistory.length > 100) mobileHistory.shift();
            }
            mobileHistoryIdx = mobileHistory.length;

            input.value = '';
            // Jaga fokus agar keyboard virtual tidak menutup antar perintah
            input.focus();
        }

        function refitActive() {
            // Tunggu layout selesai sebelum fit, agar cols/rows akurat
            requestAnimationFrame(() => {
                if (activeTab && terminals[activeTab]) {
                    terminals[activeTab].fitAddon.fit();
                    socket.emit('terminal_resize', {
                        session_id: activeTab,
                        rows: terminals[activeTab].term.rows,
                        cols: terminals[activeTab].term.cols
                    });
                }
            });
        }

        function toggleMobileBar() {
            const bar = document.getElementById('mobile-bar');
            const shown = bar.classList.toggle('visible');
            document.getElementById('kbd-toggle').classList.toggle('active', shown);

            if (shown) {
                focusMobileTarget();
            } else {
                document.getElementById('mobile-input').blur();
                clearMods();
            }
            refitActive();
        }

        function initMobileInput() {
            const bar = document.getElementById('mobile-bar');
            const input = document.getElementById('mobile-input');

            // Toolbar tampil otomatis di perangkat sentuh
            if (IS_TOUCH) {
                bar.classList.add('visible');
                document.getElementById('kbd-toggle').classList.add('active');
            }

            // Terapkan mode tersimpan (default: ketik langsung di terminal)
            bar.classList.toggle('fallback', isFallbackMode());
            const modeBtn = document.getElementById('key-mode');
            if (modeBtn) {
                modeBtn.classList.toggle('armed', isFallbackMode());
            }

            // Toolbar tombol khusus (delegasi event supaya hemat listener)
            document.getElementById('mobile-keys').addEventListener('click', (e) => {
                const btn = e.target.closest('.key-btn');
                if (!btn) return;

                // Tombol pengalih mode input
                if (btn.dataset.action === 'mode') {
                    toggleMobileMode();
                    return;
                }

                const mod = btn.dataset.mod;
                if (mod) {
                    // Toggle modifier saja, tidak mengirim apa pun
                    setMod(mod, mod === 'ctrl' ? !modCtrl : !modAlt);
                    focusMobileTarget();
                    return;
                }

                const seq = btn.dataset.seq;
                if (seq !== undefined) {
                    sendRaw(decodeSeq(seq));
                    clearMods();
                    focusMobileTarget();
                }
            });

            // mousedown di-cegah agar tap tombol tidak mencuri fokus dari
            // textarea/input — kalau fokus lepas, keyboard virtual tertutup.
            // Hanya mousedown: preventDefault pada touchstart akan ikut
            // membatalkan event click sehingga tombol tidak berfungsi.
            document.getElementById('mobile-keys').addEventListener('mousedown', (e) => {
                if (e.target.closest('.key-btn')) e.preventDefault();
            });

            // Enter mengirim baris; panah atas/bawah menelusuri riwayat lokal
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMobileInput();
                    return;
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (mobileHistoryIdx > 0) {
                        mobileHistoryIdx--;
                        input.value = mobileHistory[mobileHistoryIdx];
                    }
                    return;
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (mobileHistoryIdx < mobileHistory.length - 1) {
                        mobileHistoryIdx++;
                        input.value = mobileHistory[mobileHistoryIdx];
                    } else {
                        mobileHistoryIdx = mobileHistory.length;
                        input.value = '';
                    }
                    return;
                }
                if (e.key === 'Tab') {
                    // Tab = autocomplete shell: kirim buffer + TAB
                    e.preventDefault();
                    sendRaw(input.value + '\t');
                    input.value = '';
                    return;
                }

                // Modifier armed: kirim langsung sebagai control code supaya
                // Ctrl+C instan, tidak menumpuk di input bar.
                if ((modCtrl || modAlt) && e.key.length === 1) {
                    e.preventDefault();
                    sendRaw(applyMods(e.key));
                }
            });

            // Tap pada area terminal memunculkan keyboard virtual.
            // Mode direct: fokus ke textarea xterm yang sudah dibentangkan.
            // Mode fallback: fokus ke input bar.
            document.getElementById('terminal-container').addEventListener('click', () => {
                if (IS_TOUCH) {
                    focusMobileTarget();
                }
            });

            // Keyboard virtual mengubah tinggi viewport: refit agar baris
            // terakhir tidak tertutup keyboard.
            if (window.visualViewport) {
                let vvTimer = null;
                window.visualViewport.addEventListener('resize', () => {
                    clearTimeout(vvTimer);
                    vvTimer = setTimeout(refitActive, 120);
                });
            }
        }

        function changeFontSize(size) {
            currentFontSize = parseInt(size);
            Object.values(terminals).forEach(t => {
                t.term.options.fontSize = currentFontSize;
                t.fitAddon.fit();
            });
        }

        function toggleReadOnly(checked) {
            isReadOnly = checked;
            document.getElementById('readonly-badge').style.display = checked ? 'inline-block' : 'none';
        }

        // Custom Commands
        function renderCustomCommands() {
            const container = document.getElementById('custom-commands');
            if (customCommands.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <span class="cmd-category-label" style="background:rgba(255,255,255,0.1); color:#888">
                    <i class="fa-solid fa-star"></i> Custom
                </span>
                ${customCommands.map(c => `
                    <button class="quick-btn" onclick="quickCmd('${c.cmd.replace(/'/g, "\\'")}')" title="${c.cmd}">
                        <i class="fa-solid fa-bolt"></i> ${c.name}
                    </button>
                `).join('')}
            `;
        }

        function showCustomCmdModal() {
            const modal = document.getElementById('custom-cmd-modal');
            modal.classList.remove('hidden');
            modal.classList.add('active');
            document.getElementById('custom-cmd-input').value = customCommands.map(c => `${c.name}=${c.cmd}`).join('\n');
        }

        function hideCustomCmdModal() {
            const modal = document.getElementById('custom-cmd-modal');
            modal.classList.remove('active');
            setTimeout(() => modal.classList.add('hidden'), 300); // Wait for transition
        }

        function saveCustomCommands() {
            const input = document.getElementById('custom-cmd-input').value;
            customCommands = input.split('\n')
                .map(line => line.trim())
                .filter(line => line && line.includes('='))
                .map(line => {
                    const idx = line.indexOf('=');
                    return {
                        name: line.substring(0, idx).trim(),
                        cmd: line.substring(idx + 1).trim()
                    };
                });

            localStorage.setItem('customCommands', JSON.stringify(customCommands));
            renderCustomCommands();
            hideCustomCmdModal();
        }

        // Socket handlers
        socket.on('terminal_output', data => {
            const sessionId = data.session_id;
            if (terminals[sessionId]) {
                terminals[sessionId].term.write(data.data);
            }
        });

        socket.on('terminal_started', data => {
            console.log('Terminal started:', data.session_id);
            if (terminals[data.session_id]) {
                const t = terminals[data.session_id];
                socket.emit('terminal_resize', {
                    session_id: data.session_id,
                    rows: t.term.rows,
                    cols: t.term.cols
                });
            }
        });
    </script>
</body>

</html>
